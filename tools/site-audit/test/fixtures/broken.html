<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1024, initial-scale=1, user-scalable=no, maximum-scale=1">

  <title>Home</title>
  <style>

</head>

    <h2>Welcome</h2>

    </div>
    <img src="wide.svg">
    <img src="wide.svg" style="width:200px">

    <table>
      <tr><td>UN number</td><td>Proper shipping name</td><td>Class</td><td>Packing group</td></tr>
      <tr><td>1203</td><td>Petrol</td><td>3</td><td>II</td></tr>
